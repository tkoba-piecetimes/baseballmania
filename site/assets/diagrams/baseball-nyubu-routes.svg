<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img">
<title>大学野球部への3つの入部ルート。スポーツ推薦は高校在学中に大学側から声がかかる、セレクションは入学前に本人から連絡して実技などで判断される、一般入部は一般入試に合格したあと新歓期に加入する</title>
<rect width="640" height="440" fill="#ffffff"/>
<g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<text x="20" y="34" font-size="19" font-weight="700" fill="#1f2a44">入部のルートは3つ。大学ごとに用意されている道が違います</text>
<rect x="20" y="56" width="190" height="300" rx="10" fill="#f3f5f8" stroke="#9aa3b2" stroke-width="1.5"/>
<path d="M20 100 V66 a10 10 0 0 1 10 -10 H200 a10 10 0 0 1 10 10 V100 Z" fill="#2f6fd6"/>
<text x="115" y="87" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">スポーツ推薦</text>
<text x="34" y="126" font-size="14" font-weight="700" fill="#2f6fd6">いつ</text>
<text x="34" y="150" font-size="16" fill="#1f2a44">高校在学中</text>
<text x="34" y="202" font-size="14" font-weight="700" fill="#2f6fd6">だれから</text>
<text x="34" y="226" font-size="16" fill="#1f2a44">大学側から</text>
<text x="34" y="249" font-size="16" fill="#1f2a44">声がかかる</text>
<text x="34" y="278" font-size="14" font-weight="700" fill="#2f6fd6">特徴</text>
<text x="34" y="302" font-size="16" fill="#1f2a44">実績が評価され</text>
<text x="34" y="325" font-size="16" fill="#1f2a44">枠は大学で違う</text>
<rect x="225" y="56" width="190" height="300" rx="10" fill="#f3f5f8" stroke="#9aa3b2" stroke-width="1.5"/>
<path d="M225 100 V66 a10 10 0 0 1 10 -10 H405 a10 10 0 0 1 10 10 V100 Z" fill="#2f6fd6"/>
<text x="320" y="87" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">セレクション</text>
<text x="239" y="126" font-size="14" font-weight="700" fill="#2f6fd6">いつ</text>
<text x="239" y="150" font-size="16" fill="#1f2a44">入学前が多い</text>
<text x="239" y="173" font-size="16" fill="#1f2a44">（高3の夏など）</text>
<text x="239" y="202" font-size="14" font-weight="700" fill="#2f6fd6">だれから</text>
<text x="239" y="226" font-size="16" fill="#1f2a44">本人から</text>
<text x="239" y="249" font-size="16" fill="#1f2a44">野球部に連絡</text>
<text x="239" y="278" font-size="14" font-weight="700" fill="#2f6fd6">特徴</text>
<text x="239" y="302" font-size="16" fill="#1f2a44">実技などで判断</text>
<text x="239" y="325" font-size="16" fill="#1f2a44">狭き門になりやすい</text>
<rect x="430" y="56" width="190" height="300" rx="10" fill="#f3f5f8" stroke="#9aa3b2" stroke-width="1.5"/>
<path d="M430 100 V66 a10 10 0 0 1 10 -10 H610 a10 10 0 0 1 10 10 V100 Z" fill="#2f6fd6"/>
<text x="525" y="87" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">一般入部</text>
<text x="444" y="126" font-size="14" font-weight="700" fill="#2f6fd6">いつ</text>
<text x="444" y="150" font-size="16" fill="#1f2a44">入学後の</text>
<text x="444" y="173" font-size="16" fill="#1f2a44">新歓期</text>
<text x="444" y="202" font-size="14" font-weight="700" fill="#2f6fd6">だれから</text>
<text x="444" y="226" font-size="16" fill="#1f2a44">本人が</text>
<text x="444" y="249" font-size="16" fill="#1f2a44">一般入試で合格</text>
<text x="444" y="278" font-size="14" font-weight="700" fill="#2f6fd6">特徴</text>
<text x="444" y="302" font-size="16" fill="#1f2a44">競技以外の関わり</text>
<text x="444" y="325" font-size="16" fill="#1f2a44">方もある</text>
<text x="20" y="390" font-size="16" fill="#1f2a44">どのルートがあるかは大学ごとに違います。</text>
<text x="20" y="414" font-size="16" fill="#1f2a44">志望校の野球部の公式情報で確認しましょう。</text>
</g>
</svg>